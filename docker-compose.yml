services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: redsalud_postman
      POSTGRES_USER: ${POSTMAN_DB_USER:-redsalud_postman}
      POSTGRES_PASSWORD: ${POSTMAN_DB_PASSWORD:-redsalud_postman}
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - postman-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 3s
      retries: 15
volumes:
  postman-pgdata:
