# Reglas de SLO de RedSalud Andina. Cárgalas en Prometheus (o en un equivalente gestionado de AWS) que consulte /actuator/prometheus.
# SLO de disponibilidad: el 99,5 % de las solicitudes a la API no fallan con un 5xx, por mes. Presupuesto de error: 0,5 % (unas 3 h 36 min en 30 días).
# Las alertas usan velocidades de consumo en varias ventanas: un pico corto no avisa y una fuga lenta sí.
groups:
  - name: redsalud-sli
    rules:
      - record: sli:http_error_ratio:rate5m
        expr: |
          sum(rate(http_server_requests_seconds_count{status=~"5..", uri!~"/actuator.*"}[5m]))
          / sum(rate(http_server_requests_seconds_count{uri!~"/actuator.*"}[5m]))
      - record: sli:http_error_ratio:rate30m
        expr: |
          sum(rate(http_server_requests_seconds_count{status=~"5..", uri!~"/actuator.*"}[30m]))
          / sum(rate(http_server_requests_seconds_count{uri!~"/actuator.*"}[30m]))
      - record: sli:http_error_ratio:rate1h
        expr: |
          sum(rate(http_server_requests_seconds_count{status=~"5..", uri!~"/actuator.*"}[1h]))
          / sum(rate(http_server_requests_seconds_count{uri!~"/actuator.*"}[1h]))
      - record: sli:http_error_ratio:rate6h
        expr: |
          sum(rate(http_server_requests_seconds_count{status=~"5..", uri!~"/actuator.*"}[6h]))
          / sum(rate(http_server_requests_seconds_count{uri!~"/actuator.*"}[6h]))
      - record: sli:http_error_ratio:rate3d
        expr: |
          sum(rate(http_server_requests_seconds_count{status=~"5..", uri!~"/actuator.*"}[3d]))
          / sum(rate(http_server_requests_seconds_count{uri!~"/actuator.*"}[3d]))

  - name: redsalud-slo-alerts
    rules:
      # El presupuesto se agota en unos 2 días: avisar de inmediato.
      - alert: AvailabilityFastBurn
        expr: sli:http_error_ratio:rate1h > (14.4 * 0.005) and sli:http_error_ratio:rate5m > (14.4 * 0.005)
        for: 2m
        labels:
          severity: page
        annotations:
          summary: "El presupuesto de error se consume 14,4 veces más rápido de lo debido (SLO de disponibilidad de 99,5 % mensual)"
      # El presupuesto se agota en unos 5 días: avisar de inmediato.
      - alert: AvailabilitySlowBurn
        expr: sli:http_error_ratio:rate6h > (6 * 0.005) and sli:http_error_ratio:rate30m > (6 * 0.005)
        for: 15m
        labels:
          severity: page
        annotations:
          summary: "El presupuesto de error se consume 6 veces más rápido de lo debido (SLO de disponibilidad de 99,5 % mensual)"
      # El presupuesto se agota al final del mes: abrir un ticket.
      - alert: AvailabilityBudgetDrain
        expr: sli:http_error_ratio:rate3d > 0.005 and sli:http_error_ratio:rate6h > 0.005
        for: 1h
        labels:
          severity: ticket
        annotations:
          summary: "El presupuesto de error se consume al ritmo del SLO (disponibilidad de 99,5 % mensual)"

  - name: redsalud-latency
    rules:
      # Objetivos del historial del legado: p95 <= 2 s desde la vista, <= 6 s en la consulta directa.
      # El p95 lo calcula cada instancia, así que no se puede promediar: se alerta sobre la peor instancia.
      - alert: LegacyViewSlow
        expr: max by (source) (redsalud_legado_history_read_seconds{quantile="0.95", source=~"VIEW|STALE_VIEW"}) > 2
        for: 10m
        labels:
          severity: ticket
        annotations:
          summary: "El historial del legado desde la vista es más lento que el objetivo de p95 de 2 s"
      - alert: LegacyDirectSlow
        expr: max by (source) (redsalud_legado_history_read_seconds{quantile="0.95", source="LEGACY_DIRECT"}) > 6
        for: 10m
        labels:
          severity: ticket
        annotations:
          summary: "Las consultas directas al legado son más lentas que el objetivo de p95 de 6 s"
      # Más del 5 % de las lecturas del legado terminan en error durante 10 minutos: falla el legado o su traducción.
      - alert: LegacyReadErrors
        expr: |
          sum(rate(redsalud_legado_history_read_seconds_count{source="ERROR"}[10m]))
          / sum(rate(redsalud_legado_history_read_seconds_count[10m])) > 0.05
        for: 10m
        labels:
          severity: ticket
        annotations:
          summary: "Las lecturas del historial del legado están fallando"
