# Explicit opt-in for local Postman testing. Keep the normal Cognito profile for deployed environments.
server:
  port: ${SERVER_PORT:8080}

spring:
  datasource:
    # Dedicated local database exposed by this repository's docker-compose.yml.
    # Port 5432 is intentionally avoided so other local PostgreSQL instances remain isolated.
    url: ${POSTMAN_DB_URL:jdbc:postgresql://127.0.0.1:55432/redsalud_postman}
    username: ${POSTMAN_DB_USER:redsalud_postman}
    password: ${POSTMAN_DB_PASSWORD:redsalud_postman}
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://127.0.0.1:9090
          jwk-set-uri: http://127.0.0.1:9090/jwks.json

redsalud:
  analytics:
    pseudonym-key: ${ANALYTICS_PSEUDONYM_KEY:postman-only-pseudonym-key}

management:
  tracing:
    export:
      otlp:
        # Postman local does not require an observability collector on port 4318.
        enabled: false
