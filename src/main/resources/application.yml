spring:
  application:
    name: redsalud-andina
  profiles:
    default: dev
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
  flyway:
    # Recorre db/migration/<módulo>/ de forma recursiva. Las versiones llevan el espacio de nombres del módulo (ver README).
    locations: classpath:db/migration
    out-of-order: true
  modulith:
    events:
      republish-outstanding-events-on-restart: true
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${COGNITO_ISSUER_URI}
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 20MB
redsalud:
  attachments:
    local-dir: ${java.io.tmpdir}/redsalud-attachments
  legado:
    # El legado es una extracción nocturna, así que un día es el TTL natural del read model.
    view-ttl: PT24H
    # Tope de la consulta directa (objetivo: <= 6 s).
    direct-timeout: PT6S
    stale-retention: P7D
