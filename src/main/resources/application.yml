spring:
  application:
    name: redsalud-andina
  profiles:
    default: dev
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
  flyway:
    # Recorre db/migration/<módulo>/ de forma recursiva. Las versiones llevan el espacio de nombres del módulo (ver README).
    locations: classpath:db/migration
    out-of-order: true
  modulith:
    events:
      republish-outstanding-events-on-restart: true
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${COGNITO_ISSUER_URI}
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 20MB
redsalud:
  analytics:
    pseudonym-key: ${ANALYTICS_PSEUDONYM_KEY}
  attachments:
    local-dir: ${java.io.tmpdir}/redsalud-attachments
  legado:
    # El legado es una extracción nocturna, así que un día es el TTL natural del read model.
    view-ttl: PT24H
    # Tope de la consulta directa (objetivo: <= 6 s).
    direct-timeout: PT6S
    stale-retention: P7D
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  otlp:
    metrics:
      export:
        # Las métricas se consultan por /actuator/prometheus; las trazas salen por OTLP.
        enabled: ${OTLP_METRICS_EXPORT_ENABLED:false}
  metrics:
    distribution:
      # Buckets fijos alrededor de los objetivos (2 s vista, 6 s legado directo): cardinalidad baja y SLO calculable.
      slo:
        http.server.requests: 100ms,300ms,1s,2s,6s
  tracing:
    sampling:
      probability: ${TRACING_SAMPLING_PROBABILITY:0.1}
  opentelemetry:
    tracing:
      export:
        otlp:
          # Un colector OTLP dentro de la misma región; las trazas no llevan cuerpos, cabeceras ni motivos de acceso.
          endpoint: ${OTLP_TRACES_ENDPOINT:http://localhost:4318/v1/traces}
